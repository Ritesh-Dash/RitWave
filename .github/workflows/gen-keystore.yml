name: Generate Permanent Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create keystore and Base64
        run: |
          keytool -genkeypair -v \
            -keystore ritwave-release.keystore \
            -alias ritwave \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 'Ritesh@2008' \
            -keypass 'Ritesh@2008' \
            -dname "CN=RitWave, O=Ritesh, C=IN"
          base64 -w 0 ritwave-release.keystore > keystore-base64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ritwave-keystore-bundle
          path: |
            ritwave-release.keystore
            keystore-base64.txt
          retention-days: 1
