name: RitWave Signed Release Build

on:
  workflow_dispatch:
  push:
    branches: [ 'main' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'

jobs:
  build_release:
    name: Build Signed Universal GMS Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Permanent Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p app/keystore "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Signed Release APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          ./gradlew :app:assembleUniversalGmsRelease --no-configuration-cache --console=plain --warning-mode summary

      - name: Rename and Package Release APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/universalGms/release/*.apk release-output/RitWave-universal-gms-release.apk

      - name: Upload Signed RitWave Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RitWave-Signed-Release
          path: release-output/RitWave-universal-gms-release.apk
          if-no-files-found: error

      - name: Cleanup Keystore
        if: always()
        run: rm -f app/keystore/release.keystore
