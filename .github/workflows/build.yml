name: RitWave Signed Release Build

on:
  workflow_dispatch:
  push:
    branches: [ 'main' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'

permissions:
  contents: write

jobs:
  build_release:
    name: Build Signed Universal GMS Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Permanent Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p app/keystore "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Signed Release APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          ./gradlew :app:assembleUniversalGmsRelease \
            -PnightlyRun=${{ github.run_number }} \
            --no-configuration-cache --console=plain --warning-mode summary

      - name: Package Release APK, Manifest & Tag
        id: pkg
        run: |
          set -euo pipefail
          mkdir -p release-output
          APK_SRC=$(ls app/build/outputs/apk/universalGms/release/*.apk | head -n 1)
          APK_NAME="RitWave-universal-gms-release.apk"
          APK_DEST="release-output/$APK_NAME"
          cp "$APK_SRC" "$APK_DEST"

          TAG="v$(date +'%Y.%m.%d-%H%M')"
          SHA256=$(sha256sum "$APK_DEST" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK_DEST")

          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          BADGING=$("$AAPT2" dump badging "$APK_DEST")
          VERSION_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)
          VERSION_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)
          MIN_SDK=$(echo "$BADGING" | sed -n "s/.*sdkVersion:'\([0-9]*\)'.*/\1/p" | head -n 1)

          : "${VERSION_CODE:=1}"
          : "${VERSION_NAME:=$TAG}"
          : "${MIN_SDK:=26}"

          cat <<EOF > release-output/updater.json
          {
            "schemaVersion": 1,
            "packageName": "com.apple.android.music",
            "version": "$VERSION_NAME ($TAG)",
            "description": "Automated signed release build of RitWave ($TAG).",
            "changelog": [
              {
                "title": "Latest Build",
                "items": [
                  "Signed release $TAG with verified SHA-256 and permanent keystore."
                ]
              }
            ],
            "assets": [
              {
                "name": "$APK_NAME",
                "sha256": "$SHA256",
                "size": $SIZE,
                "versionCode": $VERSION_CODE,
                "variant": "gms",
                "abis": ["arm64-v8a", "armeabi-v7a", "x86_64", "x86"],
                "minSdk": $MIN_SDK
              }
            ]
          }
          EOF

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "RitWave ${{ steps.pkg.outputs.tag }}"
          body: "Automated signed release build of RitWave (Universal GMS)."
          files: |
            release-output/RitWave-universal-gms-release.apk
            release-output/updater.json
          make_latest: true

      - name: Cleanup Keystore
        if: always()
        run: rm -f app/keystore/release.keystore
